<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Online Enrollment System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7fb; color: #243247; }
        .navbar { background: #173b70; }
        .brand-mark { width: 36px; height: 36px; border-radius: 10px; background: #f4b942; display:inline-flex; align-items:center; justify-content:center; color:#173b70; font-weight:800; margin-right:10px; }
        .page-card { border: 0; border-radius: 16px; box-shadow: 0 8px 28px rgba(22,48,82,.08); }
        .student-link { color: #174d91; font-weight: 600; text-decoration: none; }
        .student-link:hover { text-decoration: underline; }
        .section-title { color:#173b70; font-weight:700; }
        .info-label { color:#718096; font-size:.82rem; text-transform:uppercase; letter-spacing:.04em; }
        .info-value { font-weight:600; overflow-wrap:anywhere; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="{% url 'students:student_list' %}">
            <span class="brand-mark">OE</span>Online Enrollment System
        </a>
        <a class="btn btn-outline-light btn-sm" href="/admin/">Admin Login</a>
    </div>
</nav>
<main class="container pb-5">
    {% block content %}{% endblock %}
</main>
</body>
</html>
